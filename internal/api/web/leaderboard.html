<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Wordflow Leaderboard</title>
  <meta name="description" content="See the top Temporal Wordflow players ranked by lifetime points.">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Temporal Wordflow">
  <meta property="og:title" content="Temporal Wordflow Leaderboard">
  <meta property="og:description" content="See the top Temporal Wordflow players ranked by lifetime points.">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta property="og:image" content="{{SOCIAL_IMAGE_URL}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Temporal Wordflow — a durable word game">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Temporal Wordflow Leaderboard">
  <meta name="twitter:description" content="See the top Temporal Wordflow players ranked by lifetime points.">
  <meta name="twitter:image" content="{{SOCIAL_IMAGE_URL}}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="leaderboard-page">
  <main class="leaderboard-shell">
    <header>
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <p class="eyebrow">Live durable rankings</p>
          <h1>Wordflow Leaderboard</h1>
          <p class="tagline">Lifetime points earned · refreshed automatically</p>
        </div>
      </div>
      <a class="quiet workflow-link" href="/">Play Wordflow ↗</a>
    </header>

    <div class="status-rail"><span></span> Temporal durable state · live</div>
    <section class="leaderboard-card" aria-live="polite">
      <div class="leaderboard-heading">
        <span>Rank</span><span>Player</span><span>Levels</span><span>Points</span>
      </div>
      <ol id="leaderboard-entries" class="leaderboard-entries"></ol>
      <p id="leaderboard-empty" class="leaderboard-empty">Complete a wordflow to record the first score.</p>
    </section>
    <p id="leaderboard-status" class="leaderboard-status">Connecting to the leaderboard workflow…</p>
  </main>
  <script src="/leaderboard.js" defer></script>
</body>
</html>
